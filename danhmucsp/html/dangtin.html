<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng tin - Semper</title>
    <script src="../js/theme.js"></script>
    <script src="../js/account-menu.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/page-loader.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            AOS.init({ duration: 700, easing: "ease-out-cubic", once: true, offset: 70 });
        });
    </script>
    <!-- CSS chung -->
    <link rel="stylesheet" href="../css/sanpham.css">
    <!-- CSS riêng cho trang đăng tin -->
    <link rel="stylesheet" href="../css/dangtin.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-loader" role="status" aria-label="Đang tải trang">
        <span class="loading-spinner" aria-hidden="true"></span>
    </div>
    <input type="checkbox" id="mobile-menu-toggle" style="display:none;">
    <input type="checkbox" id="theme-toggle-checkbox" style="display:none;">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="../../index.html" aria-label="Semper - về trang chủ">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>Semper<span class="brand-period">.</span></span>
        </a>

        <nav class="desktop-nav" aria-label="Điều hướng chính">
          <a class="nav-link" href="../../index.html">Trang chủ</a>
          <a class="nav-link" href="sanpham.html">Danh mục sản phẩm</a>
        </nav>

        <div class="header-actions">
          <label for="mobile-menu-toggle" class="icon-button hamburger-menu"><div class="hamburger-lines"><span class="line line1"></span><span class="line line2"></span><span class="line line3"></span></div></label>
          <a class="sell-link" href="dangtin.html" style="color: #267966;">Đăng tin</a>
          <label for="theme-toggle-checkbox" class="icon-button theme-toggle-label" aria-label="Chuyển chế độ giao diện">
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true" style="display:none;">
              <path d="M20.9 13A8.5 8.5 0 0 1 11 3.1 8.5 8.5 0 1 0 20.9 13Z"></path>
            </svg>
          </label>
          <div class="notification-menu">
            <button class="icon-button notification-button" type="button" aria-label="Mở thông báo" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 17h5l-1.4-1.4a3 3 0 0 1-.6-1.8V11a8 8 0 1 0-16 0v2.8a3 3 0 0 1-.6 1.8L1 17h5m9 0a4 4 0 0 1-8 0m8 0H5"></path>
              </svg>
              <span class="notification-dot"></span>
            </button>
            <div class="notification-popover" role="region" aria-label="Thông báo">
              <div class="notification-heading"><strong>Thông báo</strong></div>
              <div class="notification-list"></div>
            </div>
          </div>
          <div class="account-menu">
            <button class="avatar-button" type="button" aria-label="Mở biểu mẫu đăng nhập" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="8" r="3.2"></circle>
                <path d="M5.5 19c.8-3.2 3.1-4.8 6.5-4.8s5.7 1.6 6.5 4.8"></path>
              </svg>
            </button>
            <form class="login-popover" action="#" method="post">
              <h2>Đăng nhập</h2>
              <label for="post-login-account">Tài khoản</label>
              <input id="post-login-account" name="account" type="text" autocomplete="username" required>
              <label for="post-login-password">Mật khẩu</label>
              <input id="post-login-password" name="password" type="password" autocomplete="current-password" required>
              <button type="submit">Đăng nhập</button>
              <a href="#">Đăng ký</a>
            </form>
          </div>
        </div>
      </div>
    </header>

    <main class="page-container post-page" data-aos="fade-up">
        <div class="post-card" data-aos="fade-up">
            <div class="post-header">
                <h2>Đăng tin trao đổi</h2>
                <p>Chia sẻ món đồ bạn không còn sử dụng với cộng đồng</p>
            </div>
            
            <!-- FORM ĐĂNG TIN -->
            <form action="#" class="post-form">
                <!-- Tiêu đề -->
                <div class="form-group">
                    <label for="post-title">Tên sản phẩm <span class="required">*</span></label>
                    <input type="text" id="post-title" class="form-control" placeholder="Ví dụ: Bàn phím cơ Keychron K2, Điện thoại cũ..." required>
                </div>

                <!-- Danh mục sản phẩm -->
                <div class="form-group">
                    <label for="product-category">Danh mục sản phẩm <span class="required">*</span></label>
                    <select id="product-category" name="category" class="form-control" required>
                        <option value="" selected disabled>Chọn danh mục sản phẩm</option>
                        <option value="fashion">Thời trang</option>
                        <option value="home">Đồ gia dụng</option>
                        <option value="electronics">Điện tử</option>
                        <option value="books">Sách &amp; giải trí</option>
                        <option value="sport">Thể thao</option>
                    </select>
                </div>

                <!-- Giá bán -->
                <div class="form-group">
                    <label for="post-price">Giá bán <span class="required">*</span></label>
                    <div class="input-with-suffix">
                        <input type="number" id="post-price" name="price" class="form-control" min="10000" step="1000" placeholder="Nhập giá bán" required>
                        <span>đ</span>
                    </div>
                </div>

                <!-- Tình trạng -->
                <div class="form-group">
                    <label>Tình trạng sản phẩm <span class="required">*</span></label>
                    <div class="status-options">
                        <label class="status-option">
                            <input type="radio" name="status" value="Like New" required>
                            <span>Like New</span>
                        </label>
                        <label class="status-option">
                            <input type="radio" name="status" value="Good">
                            <span>Good</span>
                        </label>
                        <label class="status-option">
                            <input type="radio" name="status" value="Fair">
                            <span>Fair</span>
                        </label>
                    </div>
                </div>

                <!-- Vận chuyển -->
                <div class="form-group">
                    <label for="pickup-address">Địa chỉ lấy hàng <span class="required">*</span></label>
                    <div class="address-row">
                        <select id="pickup-address" name="pickup_address" class="form-control" required>
                            <option value="" selected disabled>Chọn địa chỉ lấy hàng</option>
                            <option value="Địa chỉ mặc định">Địa chỉ mặc định</option>
                        </select>
                        <button type="button" class="add-address-button" id="add-address-button"><i class="fas fa-plus"></i> Thêm mới</button>
                    </div>
                    <input type="text" id="new-address" class="form-control new-address-input" placeholder="Nhập địa chỉ mới rồi chọn Thêm mới" hidden>
                </div>

                <div class="form-group">
                    <label>Phí vận chuyển <span class="required">*</span></label>
                    <div class="shipping-options">
                        <label class="shipping-option">
                            <input type="radio" name="shipping_fee" value="buyer" checked required>
                            <span>Người mua trả</span>
                        </label>
                        <label class="shipping-option">
                            <input type="radio" name="shipping_fee" value="seller">
                            <span>Người bán trả</span>
                        </label>
                    </div>
                </div>

                <!-- Mô tả -->
                <div class="form-group">
                    <label for="post-desc">Mô tả chi tiết <span class="required">*</span></label>
                    <textarea id="post-desc" name="description" class="form-control" rows="5" placeholder="Mô tả tình trạng, thời gian sử dụng, lý do bán..." required></textarea>
                </div>

                <!-- Tải ảnh -->
                <div class="form-group">
                    <label>Hình ảnh sản phẩm (Tối đa 5 ảnh)</label>
                    <div class="upload-area">
                        <input type="file" id="post-images" name="images" class="file-input" multiple accept="image/*">
                        <label for="post-images" class="upload-label">
                            <i class="fas fa-cloud-upload-alt upload-icon"></i>
                            <span class="upload-text">Nhấn để chọn ảnh hoặc kéo thả vào đây</span>
                            <span class="upload-hint">Định dạng hỗ trợ: JPG, PNG, WEBP</span>
                        </label>
                    </div>
                </div>

                <!-- Nút Submit -->
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="history.back()">Hủy</button>
                    <button type="submit" class="btn-submit" onclick="this.innerHTML='<span class=\'spinner\' style=\'border-color: rgba(255,255,255,0.3); border-top-color: #fff; margin-right: 8px; width: 16px; height: 16px; border-width: 2px;\'></span> Đang đăng tin...'; this.style.pointerEvents='none'; event.preventDefault();">Đăng tin ngay</button>
                </div>
            </form>
        </div>
    </main>
    <script>
      (() => {
        const priceInput = document.querySelector("#post-price");
        const addAddressButton = document.querySelector("#add-address-button");
        const newAddressInput = document.querySelector("#new-address");
        const pickupAddress = document.querySelector("#pickup-address");

        priceInput.addEventListener("input", () => {
          if (priceInput.value && Number(priceInput.value) < 10000) {
            priceInput.setCustomValidity("Giá bán tối thiểu là 10.000đ.");
          } else {
            priceInput.setCustomValidity("");
          }
        });

        addAddressButton.addEventListener("click", () => {
          if (newAddressInput.hidden) {
            newAddressInput.hidden = false;
            newAddressInput.required = true;
            newAddressInput.focus();
            return;
          }

          const address = newAddressInput.value.trim();
          if (!address) {
            newAddressInput.reportValidity();
            return;
          }

          const option = new Option(address, address, true, true);
          pickupAddress.add(option);
          newAddressInput.value = "";
          newAddressInput.required = false;
          newAddressInput.hidden = true;
        });
      })();
    </script>
    <footer class="site-footer" data-aos="fade-up">
      <div class="site-footer-inner">
        <div class="footer-branding">
          <a class="brand footer-brand" href="../../index.html"><span class="brand-mark" aria-hidden="true">S</span><span>Semper<span class="brand-period">.</span></span></a>
          <p class="footer-copyright">© 2026 Semper. All rights reserved.</p>
        </div>
        <div class="footer-contact">
          <p class="footer-heading">Liên hệ</p>
          <div class="contact-list">
            <span class="contact-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5 9 3l2 4.5-2 1.5a14.8 14.8 0 0 0 6 6l1.5-2L21 15l-.5 2.4a2.2 2.2 0 0 1-2.4 1.6A16.8 16.8 0 0 1 5 6.4 2.2 2.2 0 0 1 6.6 3.5Z"/></svg><span><strong>Điện thoại</strong>0123456789</span></span>
            <a class="contact-item" href="mailto:hello@semper.vn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><span><strong>Email</strong>hello@semper.vn</span></a>
            <span class="contact-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></svg><span><strong>Địa chỉ</strong>Thành phố Đồng Nai</span></span>
          </div>
        </div>
      </div>
    </footer>
</body>
</html>
